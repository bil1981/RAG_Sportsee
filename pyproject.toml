[project]
name = "p10-dsml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.6",
    "langchain-huggingface>=1.2.3",
    "logfire>=5.1.1",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.53.0",
]



[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"
